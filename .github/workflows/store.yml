name: Store

on:
  push:
    paths: ['apps/**', 'tools/build_store.py', 'tools/build_adblock.py', '.github/workflows/store.yml']
  pull_request:
    paths: ['apps/**', 'tools/build_store.py', 'tools/build_adblock.py', '.github/workflows/store.yml']
  workflow_dispatch:
  schedule:
    # Fresh ad filters every day.
    - cron: '17 6 * * *'

jobs:
  build:
    name: Check apps and build the index
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the index on main
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          python3 tools/build_store.py _site
          python3 tools/build_adblock.py _site/adblock.json

      - name: Publish
        # The app reads https://raw.githubusercontent.com/851-labs/openbox/store/index.json and
        # adblock.json: the store branch holds only the latest build of them and the icons.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: _site
        run: |
          git init -q -b store
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Store index for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" store
