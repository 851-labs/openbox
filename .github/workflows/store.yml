name: Store

on:
  push:
    paths: ['apps/**', 'tools/build_store.py', '.github/workflows/store.yml']
  pull_request:
    paths: ['apps/**', 'tools/build_store.py', '.github/workflows/store.yml']
  workflow_dispatch:

jobs:
  build:
    name: Check apps and build the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: python3 tools/build_store.py _site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # The app reads https://851-labs.github.io/openbox/index.json.
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
